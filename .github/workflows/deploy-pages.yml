name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Put the built site at the repo root
        run: |
          set -euo pipefail
          touch out/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a out/. .
          git add -f .nojekyll index.html 404.html 404 _next _not-found favicon.ico favicon.svg portrait.jpg Mohamed_Elbadry_Sr_Backend_Developer.pdf
          git add -f __next._full.txt __next.__PAGE__.txt __next._tree.txt index.txt || true
          if git diff --cached --quiet; then
            echo "Published files are already up to date."
            exit 0
          fi
          git commit -m "Publish static GitHub Pages site [skip ci]"
          git push
